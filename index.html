<!DOCTYPE html>

<head>

  <title>RHEL Linux Practicals 1–6</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; background: #f3f5f8;
      color: #202633; min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #b31324; color: white; padding: 22px 16px; text-align: center;
    }
    header h1 { margin: 0 0 7px; font-size: 25px; }

    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .toolbar h2 { margin: 0; font-size: 19px; }
    .btn {
      display: inline-block; background: #b31324; color: white; text-decoration: none;
      padding: 11px 16px; border-radius: 7px; font-weight: bold;
    }
    .btn:hover { background: #8f0e1c; }
    .viewer {
      background: white; padding: 8px; border-radius: 10px;
      box-shadow: 0 3px 15px #17203318;
    }
    iframe { width: 100%; height: 78vh; min-height: 520px; border: 0; border-radius: 6px; }
    footer { text-align: center; padding: 16px; color: #687386; font-size: 13px; }
    @media (max-width: 600px) {
      header h1 { font-size: 21px; }
      iframe { height: 72vh; min-height: 460px; }
    }
  </style>
</head>
<body>
  <header>

  <!-- Second PDF -->
